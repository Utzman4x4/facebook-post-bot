name: Daily Facebook Post Bot

on:
  schedule:
  - cron: "0 13 * * *"  # 13:00 UTC = 8:00 AM CT
  workflow_dispatch:     # Optional: lets you run it manually from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Facebook Bot
        run: |
          python fb_bot.py
